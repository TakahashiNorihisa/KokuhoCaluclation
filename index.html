<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国保料シミュレーター - ビジュアル版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
        
        /* 全体レイアウト：ソース | 世帯 | プレビュー */
        .setup-wrapper { display: flex; gap: 15px; align-items: stretch; margin-top: 10px; }
        
        /* 左：ソースパネル */
        .source-panel { width: 140px; background: #fff; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-shrink: 0; }
        .person-seed { width: 70px; height: 70px; background: #007bff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: grab; margin: 0 auto; transition: 0.2s; }
        .person-seed:hover { transform: scale(1.1); }

        /* 中央：世帯枠 */
        .drop-zone { flex-grow: 1; min-height: 450px; background: #fff; border: 3px dashed #cbd5e0; border-radius: 15px; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-content: flex-start; }
        .drop-zone.drag-over { background: #e2e8f0; }

        /* 右：情報表示枠 */
        .info-panel { width: 280px; background: #fff; border-radius: 15px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-shrink: 0; border-left: 5px solid #007bff; }
        .info-title { font-weight: bold; border-bottom: 2px solid #f0f2f5; margin-bottom: 10px; padding-bottom: 5px; color: #007bff; }
        .info-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 5px; border-bottom: 1px dotted #eee; }
        .info-val { font-weight: bold; text-align: right; }

        /* 配置された人 */
        .person-item { width: 90px; text-align: center; cursor: pointer; position: relative; }
        .person-icon { width: 65px; height: 65px; background: #6c757d; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 5px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        .person-item:hover .person-icon { background: #007bff; transform: translateY(-5px); }
        
        .remove-btn { position: absolute; top: -5px; right: -5px; background: #ff4757; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; cursor: pointer; z-index: 10; }

        input[type="number"] { text-align: right; }
        .calc-result-box { text-align: right; font-weight: bold; border-bottom: 2px solid #007bff; width: 100px; display: inline-block;}

        .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-3 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand">国保料 簡易計算</span>
        <span id="csvStatus" class="badge bg-light text-dark">CSV読込中...</span>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="alert alert-info py-2 shadow-sm mb-3">
        左のアイコンを中央の枠に<strong>ドラッグ</strong>するか<strong>クリック</strong>して家族を追加してください。アイコンにマウスを乗せると右側に内容が表示されます。
    </div>

    <div class="setup-wrapper">
        <!-- ソース -->
        <div class="source-panel shadow-sm">
            <h6 class="small fw-bold">家族を追加</h6>
            <div class="person-seed shadow" draggable="true" id="dragSeed" ondragstart="dragStartHandler(event)" onclick="addPerson()">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <p class="mt-3 text-muted small">ドラッグ or クリック</p>
        </div>

        <!-- 中央：世帯 -->
        <div class="drop-zone shadow-sm" id="dropZone" ondrop="dropHandler(event)" ondragover="dragOverHandler(event)" ondragleave="dragLeaveHandler(event)">
            <!-- アイコンが並ぶ -->
        </div>

        <!-- 右：情報表示 -->
        <div class="info-panel shadow-sm" id="sideInfoPanel">
            <div class="info-title"><i class="bi bi-info-circle-fill me-2"></i>設定内容</div>
            <div id="infoContent">
                <p class="text-muted small">アイコンにマウスを乗せるとここに詳細が表示されます。</p>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <button class="btn btn-success btn-lg px-5 shadow-sm" onclick="executeCalculation()"><i class="bi bi-calculator me-2"></i>計算を実行する</button>
    </div>
</div>

<!-- 編集モーダル -->
<div class="modal fade" id="personModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content shadow-lg">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold">個人の詳細設定</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6 border-end">
                        <h6 class="mb-3 text-primary fw-bold">収入・所得情報</h6>
                        <div class="mb-3">
                            <label class="form-label small">生年月日</label>
                            <input type="date" class="form-control" id="m_birth">
                        </div>
                        <div class="mb-3 p-2 bg-light rounded border">
                            <label class="form-label small d-block mb-1">介護分限所得有無</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="m_care" id="care_no" value="無" checked>
                                <label class="form-check-label" for="care_no">無</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="m_care" id="care_yes" value="有">
                                <label class="form-check-label" for="care_yes">有</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">給与収入</label>
                            <input type="number" class="form-control" id="m_salary" oninput="updateCalculatedIncome(this.value)" placeholder="0">
                            <div class="mt-2 d-flex justify-content-between align-items-center">
                                <span class="small text-muted">自動所得:</span>
                                <span class="calc-result-box text-primary" id="m_calc_income">0</span>
                            </div>
                        </div>
                        <div class="mb-3 border-top pt-2">
                            <label class="form-label small">年金収入</label>
                            <input type="number" class="form-control" id="m_pension" placeholder="0">
                        </div>
                        <div class="row row-cols-2 g-2">
                            <div class="col"><label class="small text-muted">所得1</label><input type="number" class="form-control form-control-sm" id="m_o1" placeholder="0"></div>
                            <div class="col"><label class="small text-muted">所得2</label><input type="number" class="form-control form-control-sm" id="m_o2" placeholder="0"></div>
                            <div class="col"><label class="small text-muted">所得3</label><input type="number" class="form-control form-control-sm" id="m_o3" placeholder="0"></div>
                            <div class="col"><label class="small text-muted">所得4</label><input type="number" class="form-control form-control-sm" id="m_o4" placeholder="0"></div>
                            <div class="col"><label class="small text-muted">所得5</label><input type="number" class="form-control form-control-sm" id="m_o5" placeholder="0"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h6 class="mb-3 text-primary fw-bold">今年度加入月（予定含む）</h6>
                        <div class="month-grid p-3 border rounded bg-light">
                            <script>
                                const ms = ["4月","5月","6月","7月","8月","9月","10月","11月","12月","1月","2月","3月"];
                                ms.forEach((m, i) => {
                                    document.write(`<div class="form-check"><input class="form-check-input" type="radio" name="m_join_month" id="m_${i}" value="${m}" ${m==='4月'?'checked':''}><label class="form-check-label small" for="m_${i}">${m}</label></div>`);
                                });
                            </script>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary btn-lg w-100" onclick="savePersonData()">保存して閉じる</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let salaryTable = [];
    let household = [];
    let currentEditId = null;
    const modal = new bootstrap.Modal(document.getElementById('personModal'));

    async function init() {
        try {
            const res = await fetch('salary_table.csv?t=' + Date.now());
            const data = await res.text();
            const lines = data.split(/\r?\n/);
            salaryTable = [];
            for(let i=1; i<lines.length; i++) {
                const c = lines[i].split(',');
                if(c.length>=3) salaryTable.push({min:parseInt(c[0]), max:parseInt(c[1]), exp:c[2].trim()});
            }
            document.getElementById('csvStatus').innerText = "CSV連携OK";
            document.getElementById('csvStatus').className = "badge bg-success";
        } catch(e) { document.getElementById('csvStatus').className = "badge bg-danger"; }
    }

    function dragStartHandler(e) { e.dataTransfer.setData("text", "add"); }
    function dragOverHandler(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function dragLeaveHandler(e) { e.currentTarget.classList.remove('drag-over'); }
    function dropHandler(e) { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); addPerson(); }

    function addPerson() {
        const id = Date.now();
        household.push({ id: id, birth: "", care: "無", salary: 0, calcIncome: 0, pension: 0, o1:0, o2:0, o3:0, o4:0, o5:0, joinMonth: "4月" });
        renderHousehold();
    }

    function renderHousehold() {
        const zone = document.getElementById('dropZone');
        zone.innerHTML = "";
        household.forEach((p, index) => {
            const div = document.createElement('div');
            div.className = "person-item";
            div.onmouseenter = () => updateInfoPanel(p.id);
            div.onmouseleave = () => clearInfoPanel();
            div.innerHTML = `
                <div class="person-icon" onclick="editPerson(${p.id})">
                    <i class="bi bi-person-fill"></i>
                    <button class="remove-btn" onclick="event.stopPropagation(); removePerson(${p.id})">×</button>
                </div>
                <div class="person-label small">${index + 1}人目</div>
            `;
            zone.appendChild(div);
        });
    }

    function removePerson(id) { household = household.filter(p => p.id !== id); renderHousehold(); clearInfoPanel(); }

    function editPerson(id) {
        currentEditId = id;
        const p = household.find(x => x.id === id);
        document.getElementById('m_birth').value = p.birth;
        document.getElementById('m_salary').value = p.salary || "";
        document.getElementById('m_pension').value = p.pension || "";
        document.getElementById(p.care === '有' ? 'care_yes' : 'care_no').checked = true;
        document.getElementById('m_o1').value = p.o1 || "";
        document.getElementById('m_o2').value = p.o2 || "";
        document.getElementById('m_o3').value = p.o3 || "";
        document.getElementById('m_o4').value = p.o4 || "";
        document.getElementById('m_o5').value = p.o5 || "";
        const mRadios = document.getElementsByName('m_join_month');
        mRadios.forEach(r => { if(r.value === p.joinMonth) r.checked = true; });
        updateCalculatedIncome(p.salary);
        modal.show();
    }

    function updateCalculatedIncome(val) {
        val = parseInt(val) || 0;
        let inc = 0;
        const match = salaryTable.find(r => val >= r.min && val <= r.max);
        if(match) inc = match.exp.includes('salary') ? eval(match.exp.replace('salary', val)) : parseInt(match.exp);
        document.getElementById('m_calc_income').innerText = inc.toLocaleString();
        return inc;
    }

    function savePersonData() {
        const p = household.find(x => x.id === currentEditId);
        p.birth = document.getElementById('m_birth').value;
        p.salary = parseInt(document.getElementById('m_salary').value) || 0;
        p.calcIncome = updateCalculatedIncome(p.salary);
        p.pension = parseInt(document.getElementById('m_pension').value) || 0;
        p.care = document.querySelector('input[name="m_care"]:checked').value;
        p.o1 = parseInt(document.getElementById('m_o1').value) || 0;
        p.o2 = parseInt(document.getElementById('m_o2').value) || 0;
        p.o3 = parseInt(document.getElementById('m_o3').value) || 0;
        p.o4 = parseInt(document.getElementById('m_o4').value) || 0;
        p.o5 = parseInt(document.getElementById('m_o5').value) || 0;
        p.joinMonth = document.querySelector('input[name="m_join_month"]:checked').value;
        modal.hide();
        renderHousehold();
    }

    function updateInfoPanel(id) {
        const p = household.find(x => x.id === id);
        const idx = household.indexOf(p) + 1;
        const html = `
            <div class="fw-bold mb-2 text-dark">${idx}人目の詳細</div>
            <div class="info-row"><span>生年月日</span><span class="info-val">${p.birth || '-'}</span></div>
            <div class="info-row"><span>加入開始</span><span class="info-val">${p.joinMonth}</span></div>
            <div class="info-row"><span>介護分限</span><span class="info-val">${p.care}</span></div>
            <div class="info-row"><span>給与収入</span><span class="info-val">${p.salary.toLocaleString()}円</span></div>
            <div class="info-row text-primary"><span>給与所得</span><span class="info-val">${p.calcIncome.toLocaleString()}円</span></div>
            <div class="info-row"><span>年金収入</span><span class="info-val">${p.pension.toLocaleString()}円</span></div>
            <div class="info-row"><span>その他合算</span><span class="info-val">${(p.o1+p.o2+p.o3+p.o4+p.o5).toLocaleString()}円</span></div>
        `;
        document.getElementById('infoContent').innerHTML = html;
    }

    function clearInfoPanel() {
        document.getElementById('infoContent').innerHTML = '<p class="text-muted small">アイコンにマウスを乗せると詳細が表示されます。</p>';
    }

    function executeCalculation() {
        if(household.length === 0) { alert("家族を追加してください。"); return; }
        alert(household.length + "名分のデータを計算エンジンに送ります。");
    }

    init();
</script>

</body>
</html>
