<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国保料 簡易計算シミュレーター</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 900px; margin-top: 30px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .page { display: none; }
        .page.active { display: block; }
        .table-responsive { font-size: 0.85rem; }
        .table th { white-space: nowrap; background-color: #e9ecef; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
        .calculated-row { background-color: #fff3cd; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">国保料 簡易計算</h2>

    <div class="card p-4">
        <!-- ページ1 -->
        <div id="page1" class="page active">
            <h4 class="mb-4">1. 世帯構成について</h4>
            <div class="mb-3">
                <label class="form-label">１．国保に加入する人は何人ですか？</label>
                <input type="number" id="memberCount" class="form-control" placeholder="0" min="0">
            </div>
            <!-- ...他の質問（前回同様）... -->
            <div class="nav-buttons">
                <div></div>
                <button class="btn btn-primary" onclick="nextPage()">次へ：所得の入力 ＞</button>
            </div>
        </div>

        <!-- ページ2 -->
        <div id="page2" class="page">
            <h4 class="mb-4">2. 所得について</h4>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead>
                        <tr>
                            <th style="min-width: 150px;">項目</th>
                            <th>1人目</th>
                            <th>2人目</th>
                            <th>3人目</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th>給与収入</th>
                            <td><input type="number" class="form-control salary-input" data-person="0" placeholder="0"></td>
                            <td><input type="number" class="form-control salary-input" data-person="1" placeholder="0"></td>
                            <td><input type="number" class="form-control salary-input" data-person="2" placeholder="0"></td>
                        </tr>
                        <!-- 中略：介護分限〜その他所得4（前回と同じ） -->
                        <tr>
                            <th>その他所得５</th>
                            <td><input type="number" class="form-control" placeholder="0"></td>
                            <td><input type="number" class="form-control" placeholder="0"></td>
                            <td><input type="number" class="form-control" placeholder="0"></td>
                        </tr>
                        <!-- 追加項目：給与所得（自動計算） -->
                        <tr class="calculated-row">
                            <th>給与所得(自動計算)</th>
                            <td><input type="number" id="calcIncome0" class="form-control" readonly></td>
                            <td><input type="number" id="calcIncome1" class="form-control" readonly></td>
                            <td><input type="number" id="calcIncome2" class="form-control" readonly></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="nav-buttons mt-4">
                <button class="btn btn-secondary" onclick="prevPage()">＜ 戻る</button>
                <button class="btn btn-success" onclick="calculateFinal()">計算する</button>
            </div>
        </div>
    </div>
</div>

<script>
    let salaryTable = [];

    // CSVファイルを読み込む関数
    async function loadSalaryTable() {
        try {
            const response = await fetch('salary_table.csv');
            const data = await response.text();
            const rows = data.split('\n').slice(1); // ヘッダーを飛ばす
            salaryTable = rows.map(row => {
                const [min, max, income] = row.split(',');
                return { min: Number(min), max: Number(max), income: income.trim() };
            });
            console.log("CSV loaded", salaryTable);
        } catch (e) {
            console.error("CSV読み込み失敗", e);
        }
    }

    // 読み込み開始
    loadSalaryTable();

    // 給与収入が入力されたら所得を計算する
    document.querySelectorAll('.salary-input').forEach(input => {
        input.addEventListener('input', function() {
            const personIdx = this.dataset.person;
            const salary = Number(this.value);
            const targetField = document.getElementById(`calcIncome${personIdx}`);
            
            // CSVテーブルから該当する行を探す
            const match = salaryTable.find(row => salary >= row.min && salary <= row.max);
            
            if (match) {
                // CSVの所得欄が数値ならそのまま、計算式（例: salary-550000）なら計算する
                if (!isNaN(match.income)) {
                    targetField.value = match.income;
                } else {
                    // 簡易的な数式処理（例: "salary-550000"）
                    const formula = match.income.replace('salary', salary);
                    targetField.value = eval(formula); 
                }
            } else {
                targetField.value = 0;
            }
        });
    });

    function nextPage() {
        document.getElementById('page1').classList.remove('active');
        document.getElementById('page2').classList.add('active');
    }

    function prevPage() {
        document.getElementById('page2').classList.remove('active');
        document.getElementById('page1').classList.add('active');
    }

    function calculateFinal() {
        alert("給与所得を含めた最終計算処理をここに実装します。");
    }
</script>

</body>
</html>
